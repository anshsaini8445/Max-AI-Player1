name: Gemini Issue Coder Agent

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gemini-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  code-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install --quiet google-genai

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - << 'EOF'
          import os, sys, json, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          title = os.environ.get("ISSUE_TITLE", "").strip()
          body = os.environ.get("ISSUE_BODY", "") or ""
          issue_no = os.environ.get("ISSUE_NUMBER", "")

          if not api_key:
              print("FATAL: GEMINI_API_KEY secret is not set!")
              sys.exit(1)

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle", "node_modules", ".idea"}]
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".properties")):
                      all_files.append(os.path.relpath(os.path.join(root, f), "."))

          file_list_str = "\n".join(sorted(all_files)[:150])

          prompt = f"""You are an expert Android developer specializing in Media3/ExoPlayer.
          App name: MAX.
          
          CRITICAL MEDIA3 RULES:
          - PlayerView does NOT have 'isControllerVisible'. Use 'isControllerFullyVisible()' or showController()/hideController().
          - Ensure all Kotlin code compiles with strict type safety.

          Repository files:
          {file_list_str}

          Task from GitHub Issue #{issue_no}:
          Title: {title}
          Details: {body}

          Return ONLY a valid JSON object in this exact format:
          {{
            "summary": "Short explanation of fix",
            "files": [
              {{
                "filepath": "app/src/main/java/path/to/File.kt",
                "content": "FULL_UPDATED_CONTENT"
              }}
            ]
          }}
          """

          client = genai.Client(api_key=api_key)
          candidate_models = ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.5-flash-lite"]
          response = None

          for model_name in candidate_models:
              try:
                  print(f"Trying model: {model_name}...")
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json",
                          temperature=0.2
                      )
                  )
                  print(f"Success with model: {model_name}")
                  break
              except Exception as err:
                  print(f"Model {model_name} failed: {err}")

          if not response or not getattr(response, "text", None):
              print("FATAL: All model requests failed!")
              sys.exit(1)

          raw_text = response.text.strip()
          try:
              data = json.loads(raw_text)
          except Exception:
              match = re.search(r"\{[\s\S]*\}", raw_text)
              data = json.loads(match.group(0)) if match else None

          if not data or not isinstance(data.get("files"), list):
              print("FATAL: Invalid JSON structure")
              sys.exit(1)

          changed = []
          for item in data["files"]:
              fp = item.get("filepath", "").strip().replace("\\", "/")
              if fp.startswith("./"): fp = fp[2:]
              if ".." in fp or fp.startswith("/"): continue

              Path(fp).parent.mkdir(parents=True, exist_ok=True)
              with open(fp, "w", encoding="utf-8") as f:
                  f.write(item.get("content", ""))
              changed.append(fp)
              print(f"Updated: {fp}")

          with open("agent_summary.txt", "w", encoding="utf-8") as f:
              f.write(data.get("summary", "Automated code update"))
          EOF

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            SUMMARY=$(cat agent_summary.txt 2>/dev/null || echo "Automated update")
            git commit -m "Auto-implement Issue #${{ github.event.issue.number }}: $SUMMARY"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Player-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success'
              ? '✅ Task complete! Gemini fixed the code and built your new APK. Download it from the Artifacts section above.'
              : '❌ Build failed. Please check compiler logs.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
