name: Gemini Issue Coder Agent

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gemini-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  code-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --quiet google-generativeai

      - name: Run Gemini Code Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import re
          from pathlib import Path
          import google.generativeai as genai

          API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          ISSUE_TITLE = os.environ.get("ISSUE_TITLE", "").strip()
          ISSUE_BODY = os.environ.get("ISSUE_BODY", "").strip()
          ISSUE_NO = os.environ.get("ISSUE_NUMBER", "")

          if not API_KEY:
              print("❌ GEMINI_API_KEY missing!")
              sys.exit(1)

          genai.configure(api_key=API_KEY)

          print("📁 Scanning project...")
          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle", "node_modules", ".idea", ".github"}]
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".properties", ".json")):
                      rel_path = os.path.relpath(os.path.join(root, f), ".")
                      all_files.append(rel_path)

          print(f"✅ Found {len(all_files)} relevant files")

          context_files = {}
          target_files = [
              "app/src/main/java/com/app/mediaplayer/PlayerActivity.kt",
              "app/src/main/res/layout/activity_player.xml",
              "app/build.gradle.kts",
              "app/src/main/AndroidManifest.xml"
          ]

          for tf in target_files:
              if os.path.exists(tf):
                  try:
                      with open(tf, "r", encoding="utf-8") as f:
                          context_files[tf] = f.read()
                  except Exception as e:
                      print(f"⚠️ Could not read {tf}: {e}")

          context_block = "\n\n".join([f"### {fname}\n```\n{content[:2000]}\n```" 
                                       for fname, content in context_files.items()])

          prompt = f"""You are an expert Android Kotlin developer for MAX media player.

**PROJECT CONTEXT:**
{context_block}

**AVAILABLE PROJECT FILES:**
{json.dumps(all_files[:20], indent=2)}

**ISSUE TO RESOLVE:**
- Issue #{ISSUE_NO}
- Title: {ISSUE_TITLE}
- Description: {ISSUE_BODY}

**CRITICAL REQUIREMENTS:**
1. Only modify files that already exist in the project
2. Never invent R.id elements - check layout files first
3. Keep all existing working code intact
4. Return COMPLETE file content, not snippets
5. Only use public/stable Android APIs
6. Add proper error handling and logging
7. Follow Kotlin best practices

**RESPONSE FORMAT (VALID JSON ONLY):**
{{
  "analysis": "Quick analysis of the issue",
  "changes": "What you're fixing",
  "files": [
    {{
      "filepath": "exact/file/path.kt",
      "action": "create or update",
      "content": "FULL FILE CONTENT HERE"
    }}
  ],
  "build_instructions": "Any special gradle/build notes"
}}"""

          print(f"\n🤖 Calling Gemini (Issue #{ISSUE_NO})...")

          # gemini-3.5-flash = current GA/stable model (May 2026 onward)
          # gemini-2.5-flash / gemini-2.5-pro = older but still-served fallbacks
          # gemini-2.0-flash removed entirely — shut down March 31, 2026
          models = ["gemini-3.5-flash", "gemini-2.5-flash", "gemini-2.5-pro"]
          response = None

          for model in models:
              try:
                  print(f"   Trying {model}...")
                  response = genai.GenerativeModel(model).generate_content(
                      prompt,
                      generation_config=genai.types.GenerationConfig(
                          temperature=0.1,
                          top_p=0.95,
                          response_mime_type="application/json"
                      )
                  )
                  print(f"   ✅ Success with {model}")
                  break
              except Exception as e:
                  print(f"   ⚠️ {model} failed: {str(e)[:120]}")

          if not response:
              print("❌ All models failed! Check API key validity / quota / region access.")
              sys.exit(1)

          raw_text = response.text.strip()

          try:
              data = json.loads(raw_text)
          except json.JSONDecodeError:
              match = re.search(r"\{[\s\S]*\}", raw_text)
              if not match:
                  print(f"❌ Invalid JSON from Gemini:\n{raw_text[:500]}")
                  sys.exit(1)
              try:
                  data = json.loads(match.group(0))
              except Exception:
                  print("❌ Could not parse extracted JSON")
                  sys.exit(1)

          updated_files = []
          for item in data.get("files", []):
              filepath = item.get("filepath", "").strip().replace("\\", "/")
              if filepath.startswith("./"):
                  filepath = filepath[2:]

              if ".." in filepath or filepath.startswith("/"):
                  print(f"⚠️ Skipped unsafe path: {filepath}")
                  continue

              Path(filepath).parent.mkdir(parents=True, exist_ok=True)
              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(item.get("content", ""))
              updated_files.append(filepath)
              print(f"✏️  Updated: {filepath}")

          if not updated_files:
              print("⚠️ No files were generated")

          summary = data.get("analysis", "Issue #" + ISSUE_NO)
          with open("agent_summary.txt", "w") as f:
              f.write(f"Issue #{ISSUE_NO}: {summary}\n\n")
              f.write(f"Modified files: {', '.join(updated_files)}\n")
              f.write(f"\nBuild notes:\n{data.get('build_instructions', 'None')}")

          print(f"\n✅ Agent completed. Updated {len(updated_files)} file(s)")
          EOF

      - name: Commit Changes
        run: |
          git config --global user.name "gemini-agent[bot]"
          git config --global user.email "gemini-agent@ansh-apps.dev"
          git add -A
          if ! git diff --staged --quiet; then
            SUMMARY=$(head -1 agent_summary.txt 2>/dev/null || echo "Auto-fix Issue #${{ github.event.issue.number }}")
            git commit -m "🤖 $SUMMARY"
            git push origin HEAD:main
            echo "PUSH_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "PUSH_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Player-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.existsSync('agent_summary.txt') 
              ? fs.readFileSync('agent_summary.txt', 'utf8') 
              : 'Build completed';
            const status = '${{ job.status }}';
            const pushSuccess = '${{ env.PUSH_SUCCESS }}' === 'true';

            let body = '';
            if (status === 'success' && pushSuccess) {
              body = '✅ **Issue Resolved!**\n\n' +
                     '```\n' + summary + '\n```\n\n' +
                     '📦 APK artifact ready in Actions → Artifacts\n' +
                     '🚀 Changes pushed to main branch';
            } else if (pushSuccess) {
              body = '⚠️ **Code generated but build failed**\n\nCheck Actions logs for compiler errors';
            } else {
              body = '❌ **Agent failed**\n\nSee workflow logs for details';
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
