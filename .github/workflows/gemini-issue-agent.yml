name: Autonomous Self-Healing Gemini Agent

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gemini-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  self-healing-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Official GenAI SDK
        run: pip install --quiet google-genai

      - name: Locate and Prepare Gradlew
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_FILE" ]; then
            chmod +x "$GRADLEW_FILE"
            echo "GRADLEW_PATH=$GRADLEW_FILE" >> $GITHUB_ENV
            echo "PROJECT_DIR=$(dirname "$GRADLEW_FILE")" >> $GITHUB_ENV
          else
            echo "FATAL: gradlew not found!"
            exit 1
          fi

      - name: Run Self-Healing AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - << 'EOF'
          import os, sys, json, re, subprocess
          from pathlib import Path
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          title = os.environ.get("ISSUE_TITLE", "").strip()
          body = os.environ.get("ISSUE_BODY", "") or ""
          issue_no = os.environ.get("ISSUE_NUMBER", "")
          project_dir = os.environ.get("PROJECT_DIR", ".")
          gradlew_path = os.environ.get("GRADLEW_PATH", "./gradlew")

          if not api_key:
              print("FATAL: GEMINI_API_KEY missing!")
              sys.exit(1)

          client = genai.Client(api_key=api_key)

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle", "node_modules", ".idea", ".github"}]
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".properties")):
                      all_files.append(os.path.relpath(os.path.join(root, f), "."))

          file_list_str = "\n".join(sorted(all_files)[:150])

          base_prompt = f"""You are an elite autonomous Android engineer building 'MAX' media player.
          Repository structure:
          {file_list_str}

          Task from Issue #{issue_no}:
          Title: {title}
          Details: {body}

          STRICT COMPILATION RULES:
          1. Return fully compilable Kotlin/XML code.
          2. Never reference missing UI IDs (R.id.*).
          3. Escape all backslashes properly in regex to avoid JSON parsing errors (use \\\\ instead of \\).
          4. Output STRICT JSON format only:
          {{"summary": "Short explanation", "files": [{{"filepath": "path/to/File.kt", "content": "FULL_CODE"}}]}}
          """

          current_prompt = base_prompt
          max_retries = 3
          build_success = False

          for attempt in range(1, max_retries + 1):
              print(f"\n--- ATTEMPT {attempt} OF {max_retries} ---")
              
              response = None
              for model_name in ["gemini-3.5-flash", "gemini-3.6-flash", "gemini-3.8-flash"]:
                  try:
                      print(f"Connecting to model {model_name}...")
                      response = client.models.generate_content(
                          model=model_name,
                          contents=current_prompt,
                          config=types.GenerateContentConfig(response_mime_type="application/json", temperature=0.1)
                      )
                      break
                  except Exception as err:
                      print(f"Model {model_name} skipped: {err}")
              
              if not response:
                  print("FATAL: All models failed to respond.")
                  sys.exit(1)

              raw_text = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', response.text.strip())
              
              try:
                  data = json.loads(raw_text)
              except Exception:
                  match = re.search(r"\{[\s\S]*\}", raw_text)
                  data = json.loads(match.group(0)) if match else None

              if not data or "files" not in data:
                  print("FATAL: Invalid JSON structure.")
                  sys.exit(1)

              for item in data.get("files", []):
                  fp = item.get("filepath", "").strip().replace("\\", "/")
                  if fp.startswith("./"): fp = fp[2:]
                  if ".." in fp or fp.startswith("/"): continue
                  Path(fp).parent.mkdir(parents=True, exist_ok=True)
                  with open(fp, "w", encoding="utf-8") as f:
                      f.write(item.get("content", ""))
                  print(f"File updated: {fp}")

              with open("agent_summary.txt", "w", encoding="utf-8") as f:
                  f.write(data.get("summary", f"Automated fix attempt {attempt}"))

              # ==== SELF-HEALING BUILD VERIFICATION ====
              print("\nRunning background Gradle Build to verify code...")
              build_process = subprocess.run(
                  [gradlew_path, "assembleDebug", "--no-daemon", "-x", "test"], 
                  cwd=project_dir, capture_output=True, text=True
              )
              
              if build_process.returncode == 0:
                  print("✅ BUILD SUCCESSFUL! Code is perfect.")
                  build_success = True
                  break
              else:
                  print("❌ BUILD FAILED. Triggering Self-Healing...")
                  error_log = build_process.stderr + build_process.stdout
                  short_error = error_log[-2500:] # Get the last crucial part of the error
                  print(f"Error captured:\n{short_error[-500:]}")
                  
                  # Feed the error back to Gemini
                  current_prompt = base_prompt + f"\n\nCRITICAL: Your previous code failed to compile. Here is the compiler error log:\n```\n{short_error}\n```\nIdentify the mistake (e.g., missing import, wrong ID, unresolved reference, AAPT error) and provide the FULL FIXED JSON code again."

          if not build_success:
              print("FATAL: Self-healing failed after max retries. Developer intervention needed.")
              sys.exit(1)
          EOF

      - name: Commit and Push Verified Code
        run: |
          git config --global user.name "gemini-agent[bot]"
          git config --global user.email "gemini-agent@google.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes detected."
          else
            SUMMARY=$(cat agent_summary.txt 2>/dev/null || echo "Self-healed feature implementation")
            git commit -m "feat(auto): Issue #${{ github.event.issue.number }} - $SUMMARY"
            git push origin HEAD:main
          fi

      - name: Upload Verified APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Player-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success'
              ? '✅ **Success (Self-Healed)!** Gemini Agent wrote the code, checked for errors, automatically fixed any issues, and successfully built your APK. Download **MAX-Player-APK** from the Artifacts section.'
              : '❌ **Failed.** The agent tried to self-heal but the errors were too complex. Please check the Action logs.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
