name: Gemini Issue Coder Agent

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gemini-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  code-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Official GenAI SDK
        run: pip install --quiet google-genai

      - name: Run Gemini Autonomous Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - << 'EOF'
          import os, sys, json, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          title = os.environ.get("ISSUE_TITLE", "").strip()
          body = os.environ.get("ISSUE_BODY", "") or ""
          issue_no = os.environ.get("ISSUE_NUMBER", "")

          if not api_key:
              print("FATAL: GEMINI_API_KEY secret missing!")
              sys.exit(1)

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle", "node_modules", ".idea", ".github"}]
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".properties")):
                      all_files.append(os.path.relpath(os.path.join(root, f), "."))

          file_list_str = "\n".join(sorted(all_files)[:150])

          prompt = f"""You are an elite autonomous Android engineer building 'MAX' media player using modern Media3/ExoPlayer.
          
          Repository structure:
          {file_list_str}

          Task from Issue #{issue_no}:
          Title: {title}
          Details: {body}

          STRICT COMPILATION RULES:
          1. Return fully compilable Kotlin/XML code. Do not omit code.
          2. Never reference UI IDs (R.id.*) that do not exist. Always use findViewById safely or build programmatic views.
          3. Escape all backslashes properly in regex to avoid JSON parsing errors.
          4. Output STRICT JSON only. Format:
          {{
            "summary": "Short explanation of implemented changes",
            "files": [
              {{
                "filepath": "relative/path/to/File.kt",
                "content": "FULL_CODE_HERE"
              }}
            ]
          }}
          """

          client = genai.Client(api_key=api_key)
          # Removed models throwing 503 errors and prioritized the stable 3.5-flash
          candidate_models = ["gemini-3.5-flash", "gemini-3.6-flash", "gemini-3.8-flash"]
          response = None

          for model_name in candidate_models:
              try:
                  print(f"Connecting to: {model_name}...")
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json",
                          temperature=0.1
                      )
                  )
                  print(f"Success with model: {model_name}")
                  break
              except Exception as err:
                  print(f"Model {model_name} skipped: {err}")

          if not response or not getattr(response, "text", None):
              print("FATAL: Gemini failed to respond.")
              sys.exit(1)

          raw_text = response.text.strip()
          
          # MAGIC FIX FOR JSONDecodeError: Invalid \escape
          # This automatically double-escapes backslashes used in Kotlin regex so json.loads doesn't crash
          raw_text = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', raw_text)

          try:
              data = json.loads(raw_text)
          except Exception as e:
              match = re.search(r"\{[\s\S]*\}", raw_text)
              try:
                  data = json.loads(match.group(0)) if match else None
              except Exception as inner_e:
                  print(f"FATAL: JSON Parsing failed after regex fix. Error: {inner_e}")
                  sys.exit(1)

          if not data or not isinstance(data.get("files"), list):
              print("FATAL: Invalid JSON structure returned.")
              sys.exit(1)

          updated_files = []
          for item in data["files"]:
              fp = item.get("filepath", "").strip().replace("\\", "/")
              if fp.startswith("./"): fp = fp[2:]
              if ".." in fp or fp.startswith("/"): continue

              Path(fp).parent.mkdir(parents=True, exist_ok=True)
              with open(fp, "w", encoding="utf-8") as f:
                  f.write(item.get("content", ""))
              updated_files.append(fp)
              print(f"Auto-written: {fp}")

          with open("agent_summary.txt", "w", encoding="utf-8") as f:
              f.write(data.get("summary", "Automated code update"))
          EOF

      - name: Commit and Push to Main
        run: |
          git config --global user.name "gemini-agent[bot]"
          git config --global user.email "gemini-agent@google.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes detected."
          else
            SUMMARY=$(cat agent_summary.txt 2>/dev/null || echo "Automated feature implementation")
            git commit -m "feat(agent): Auto-implement Issue #${{ github.event.issue.number }} - $SUMMARY"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Auto-Locate Gradlew and Build APK
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_FILE" ]; then
            echo "Found gradlew at: $GRADLEW_FILE"
            chmod +x "$GRADLEW_FILE"
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            cd "$PROJECT_DIR"
            ./gradlew assembleDebug --no-daemon -x test
          else
            echo "FATAL: gradlew file not found in repository!"
            exit 1
          fi

      - name: Upload Built APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Player-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success'
              ? '✅ **Success!** Gemini Agent has implemented the requested code, verified compilation, and generated your new APK. Download **MAX-Player-APK** directly from the Artifacts section above.'
              : '❌ **Build Failed.** Please inspect the compiler output in the Actions run tab.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
