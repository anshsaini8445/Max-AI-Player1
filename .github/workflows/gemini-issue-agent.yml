name: Gemini Issue Coder Agent

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: gemini-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  code-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: pip install --quiet google-genai

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - << 'EOF'
          import os, sys, json, re
          from pathlib import Path
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          title = os.environ.get("ISSUE_TITLE", "").strip()
          body = os.environ.get("ISSUE_BODY", "") or ""
          issue_no = os.environ.get("ISSUE_NUMBER", "")

          if not api_key:
              print("GEMINI_API_KEY missing!")
              sys.exit(1)

          all_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle", "node_modules", ".idea"}]
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".gradle", ".kts", ".properties")):
                      all_files.append(os.path.relpath(os.path.join(root, f), "."))

          file_list_str = "\n".join(sorted(all_files)[:150])

          prompt = f"""You are an expert Android developer building MAX media player (ExoPlayer/Media3).
          Repository structure:
          {file_list_str}

          Task from Issue #{issue_no}:
          Title: {title}
          Details: {body}

          CRITICAL RULES:
          1. Return valid JSON only.
          2. Always provide the COMPLETE file content without cuts.
          3. Maintain correct Android packages and imports.

          Output format:
          {{
            "summary": "Short explanation",
            "files": [
              {{
                "filepath": "relative/path/to/File.kt",
                "content": "FULL_CODE"
              }}
            ]
          }}
          """

          client = genai.Client(api_key=api_key)
          candidate_models = ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.5-flash-lite"]
          response = None

          for model_name in candidate_models:
              try:
                  print(f"Connecting to model: {model_name}...")
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json",
                          temperature=0.2
                      )
                  )
                  print(f"Success with model: {model_name}")
                  break
              except Exception as err:
                  print(f"Model {model_name} failed: {err}")

          if not response or not getattr(response, "text", None):
              print("FATAL: All model calls failed.")
              sys.exit(1)

          raw_text = response.text.strip()
          try:
              data = json.loads(raw_text)
          except Exception:
              match = re.search(r"\{[\s\S]*\}", raw_text)
              data = json.loads(match.group(0)) if match else None

          for item in data.get("files", []):
              fp = item.get("filepath", "").strip().replace("\\", "/")
              if fp.startswith("./"): fp = fp[2:]
              if ".." in fp or fp.startswith("/"): continue
              Path(fp).parent.mkdir(parents=True, exist_ok=True)
              with open(fp, "w", encoding="utf-8") as f:
                  f.write(item.get("content", ""))
              print(f"Updated: {fp}")

          with open("agent_summary.txt", "w", encoding="utf-8") as f:
              f.write(data.get("summary", "Automated code update"))
          EOF

      - name: Commit and Push Code Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            SUMMARY=$(cat agent_summary.txt 2>/dev/null || echo "Feature implementation")
            git commit -m "Auto-implement Issue #${{ github.event.issue.number }}: $SUMMARY"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Auto-Find Gradlew and Build APK
        run: |
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_FILE" ]; then
            echo "Found gradlew at: $GRADLEW_FILE"
            chmod +x "$GRADLEW_FILE"
            PROJECT_DIR=$(dirname "$GRADLEW_FILE")
            echo "Navigating to: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            ./gradlew assembleDebug --no-daemon
          else
            echo "Searching for gradle wrapper jar..."
            WRAPPER_JAR=$(find . -name "gradle-wrapper.jar" -type f | head -n 1)
            if [ -n "$WRAPPER_JAR" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$(dirname "$WRAPPER_JAR")")")
              cd "$PROJECT_DIR"
              java -jar "$WRAPPER_JAR" assembleDebug --no-daemon
            else
              echo "FATAL: Neither gradlew nor gradle wrapper found!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Player-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success'
              ? '✅ Success! Gemini has implemented your feature and built the APK. Download MAX-Player-APK from the Artifacts section above.'
              : '❌ Execution failed. Please check logs.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
