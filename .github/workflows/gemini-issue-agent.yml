name: Gemini Issue Coder Agent

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  code-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: |
          pip install --quiet google-genai

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import re
          import traceback
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          issue_no = os.environ.get("ISSUE_NUMBER", "")

          if not api_key:
              print("FATAL: GEMINI_API_KEY secret is not set!")
              sys.exit(1)

          # 1. Get repository file structure so Gemini knows exact file paths
          all_files = []
          for root, dirs, files in os.walk("."):
              if ".git" in root or "build" in root:
                  continue
              for f in files:
                  if f.endswith((".kt", ".java", ".xml", ".gradle", ".properties")):
                      all_files.append(os.path.relpath(os.path.join(root, f), "."))
          file_list_str = "\n".join(all_files[:100])

          prompt = f"""
          You are an expert Android developer building an ExoPlayer/Media3 media player named MAX.
          Repository files:
          {file_list_str}

          Task from GitHub Issue #{issue_no}:
          Title: {title}
          Details: {body}

          Identify the single most appropriate file to modify or create to implement this feature.
          Return a JSON object with:
          - "filepath": Relative path to the file (e.g. app/src/main/java/.../PlayerActivity.kt)
          - "content": Complete updated source code of the file.

          Format strictly as:
          {{"filepath": "path/to/file", "content": "full_code"}}
          """

          client = genai.Client(api_key=api_key)

          # 2. Try the primary model chain
          candidate_models = ["gemini-3.8-flash", "gemini-3.6-flash", "gemini-3.5-flash-lite"]
          response = None
          used_model = None

          for model_name in candidate_models:
              try:
                  print(f"Attempting model: {model_name}...")
                  response = client.models.generate_content(
                      model=model_name,
                      contents=prompt,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json"
                      )
                  )
                  used_model = model_name
                  print(f"Success with model: {used_model}")
                  break
              except Exception as err:
                  print(f"Model {model_name} failed: {err}")

          if not response or not response.text:
              print("FATAL: All model requests failed!")
              sys.exit(1)

          raw_text = response.text.strip()
          print("Raw response received, length:", len(raw_text))

          # 3. Robust JSON extraction
          try:
              data = json.loads(raw_text)
          except Exception:
              json_match = re.search(r"\{[\s\S]*\}", raw_text)
              if json_match:
                  data = json.loads(json_match.group(0))
              else:
                  raise ValueError("No valid JSON found in model output")

          filepath = data.get("filepath", "").strip()
          content = data.get("content", "")

          if not filepath or not content:
              print("FATAL: Incomplete JSON returned (missing filepath or content)")
              sys.exit(1)

          # Normalize filepath
          if filepath.startswith("./"):
              filepath = filepath[2:]

          os.makedirs(os.path.dirname(filepath), exist_ok=True)
          with open(filepath, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Successfully updated {filepath} using {used_model}!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini-Agent"
          git config --global user.email "agent@gemini.ai"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Auto-implemented Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Comment on Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const body = status === 'success'
              ? '✅ Task completed successfully! Changes committed to the repository and APK build started.'
              : '❌ Task execution encountered an error. Please check the Action run logs.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
