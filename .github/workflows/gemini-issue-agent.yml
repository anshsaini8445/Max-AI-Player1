name: Gemini Issue Coder Agent

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  code-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os, json, urllib.request

          api_key = os.environ.get("GEMINI_API_KEY")
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")
          issue_no = os.environ.get("ISSUE_NUMBER")

          prompt = f"""
          You are an expert Android Kotlin developer working on an ExoPlayer/Media3 media player app named MAX.
          User request from GitHub Issue:
          Title: {title}
          Details: {body}

          Determine the exact file to create or modify. Return strictly valid JSON in this format:
          {{
            "filepath": "exact/path/to/file.kt",
            "content": "FULL_UPDATED_CODE_WITHOUT_OMISSIONS"
          }}
          Do not include markdown blocks or text outside the JSON.
          """

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          req_data = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode("utf-8")
          req = urllib.request.Request(url, data=req_data, headers={"Content-Type": "application/json"})
          
          try:
              with urllib.request.urlopen(req) as res:
                  resp_json = json.loads(res.read().decode())
                  text = resp_json['candidates'][0]['content']['parts'][0]['text'].strip()
                  if text.startswith("```json"):
                      text = text.split("```json")[1].split("```")[0].strip()
                  elif text.startswith("```"):
                      text = text.split("```")[1].split("```")[0].strip()
                  
                  data = json.loads(text)
                  filepath = data['filepath']
                  content = data['content']

                  os.makedirs(os.path.dirname(filepath), exist_ok=True)
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"File {filepath} successfully updated by Gemini.")
          except Exception as e:
              print(f"Agent Execution Error: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini-Agent"
          git config --global user.email "agent@gemini.ai"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update from Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
            git push
          fi

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Agent ne task pura karke code repository mein commit kar diya hai! Build shuru ho chuka hai.'
            })
