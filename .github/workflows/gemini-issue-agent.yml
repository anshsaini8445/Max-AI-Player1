name: Gemini Issue Coder Agent

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  code-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Official Google AI SDK
        run: |
          pip install --quiet google-generativeai

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os, json
          import google.generativeai as genai

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          title = os.environ.get("ISSUE_TITLE", "")
          body = os.environ.get("ISSUE_BODY", "")

          if not api_key:
              print("GEMINI_API_KEY secret nahi mila!")
              exit(1)

          genai.configure(api_key=api_key)

          # Auto-select active model without 404 error
          chosen_model = "gemini-1.5-flash"
          try:
              available = [m.name for m in genai.list_models() if 'generateContent' in m.supported_generation_methods]
              for m in available:
                  if "flash" in m.lower():
                      chosen_model = m
                      break
              else:
                  if available:
                      chosen_model = available[0]
          except Exception as e:
              print(f"Model selection fallback: {e}")

          print(f"Connecting to model: {chosen_model}")
          model = genai.GenerativeModel(chosen_model)

          prompt = f"""
          You are an expert Android Kotlin developer working on an ExoPlayer/Media3 media player app named MAX.
          User request from GitHub Issue:
          Title: {title}
          Details: {body}

          Determine the exact file to modify or create (for example: app/src/main/java/com/app/mediaplayer/PlayerActivity.kt).
          Output strictly valid JSON with this exact format:
          {{
            "filepath": "app/src/main/java/com/app/mediaplayer/PlayerActivity.kt",
            "content": "FULL_UPDATED_CODE_OF_FILE_WITHOUT_OMISSIONS"
          }}
          Do not include markdown backticks or any explanation outside the JSON.
          """

          response = model.generate_content(prompt)
          text = response.text.strip()

          if text.startswith("```json"):
              text = text.split("```json")[1].split("```")[0].strip()
          elif text.startswith("```"):
              text = text.split("```")[1].split("```")[0].strip()

          data = json.loads(text)
          filepath = data['filepath']
          content = data['content']

          os.makedirs(os.path.dirname(filepath), exist_ok=True)
          with open(filepath, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"File {filepath} successfully auto-updated by Gemini Agent!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini-Agent"
          git config --global user.email "agent@gemini.ai"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes needed"
          else
            git commit -m "Auto-implemented Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
            git push
          fi

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Agent ne task pura karke code repository mein commit kar diya hai! Naya APK build shuru ho chuka hai.'
            })
